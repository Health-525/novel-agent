[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "novel-agent"
version = "0.2.0"
description = "AI-driven Chinese novel writing assistant with Obsidian knowledge base"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "python-frontmatter>=1",
    "anthropic>=0.30",
    "openai>=1.0",
    "rich>=13",
    "typer>=0.9",
    "edge-tts>=6.1",
]

[project.scripts]
novel-agent = "ui.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["engine*", "llm*", "knowledge*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
